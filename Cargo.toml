[package]
name = "o2cloud-cli"
version = "0.4.0"
edition = "2021"
description = "CLI for O2 Cloud (Telefónica Spain) — manage your cloud storage from the terminal"
license = "MIT"
repository = "https://github.com/danielperez9430/o2cloud-cli"
readme = "README.md"
keywords = ["o2", "cloud", "cli", "telefonica", "storage"]
categories = ["command-line-utilities"]

[[bin]]
name = "o2cloud"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["json", "cookies", "multipart", "rustls-tls", "gzip", "brotli", "deflate", "stream"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
wry = "0.55"
winit = "0.30"
url = "2"
thiserror = "2"
dirs = "6"
base64 = "0.22"
zip = "9"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
