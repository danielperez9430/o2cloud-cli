name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  # Weekly, so a new security advisory (`cargo audit`) or lint shows up
  # as a failed run (GitHub emails it) before the next release, not
  # during it. The build jobs only run on tags.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install Rust
        run: rustup update stable
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit dependencies
        run: cargo audit

  # Tests on Windows too, with long paths turned off as on most PCs
  # (GitHub's runners turn them on), so paths over 260 characters are
  # tested the way users meet them.
  test-windows:
    runs-on: windows-latest
    steps:
      - name: Turn off long path support
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -Value 0
          Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup update stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test

  build-macos:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup update stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf o2cloud-${{ matrix.target }}.tar.gz o2cloud

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: o2cloud-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/o2cloud-${{ matrix.target }}.tar.gz

  build-linux:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    # Pinned, not ubuntu-latest: the binary needs at least the glibc of
    # the system it is built on (2.39 here), so a newer runner would stop
    # it from running on Ubuntu 24.04 LTS and similar.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install system deps (WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust
        run: rustup update stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Check the glibc it needs
        run: |
          need=$(objdump -T target/release/o2cloud | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "Needs $need"
          [ "$(printf '%s\n' "$need" GLIBC_2.39 | sort -V | tail -1)" = GLIBC_2.39 ] || { echo "::error::needs $need, more than Ubuntu 24.04's GLIBC_2.39"; exit 1; }

      - name: Package
        run: |
          cd target/release
          tar -czf o2cloud-x86_64-unknown-linux-gnu.tar.gz o2cloud

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: o2cloud-x86_64-unknown-linux-gnu
          path: target/release/o2cloud-x86_64-unknown-linux-gnu.tar.gz

  build-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, test-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup update stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          cd target/release
          Compress-Archive -Path o2cloud.exe -DestinationPath o2cloud-x86_64-pc-windows-msvc.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: o2cloud-x86_64-pc-windows-msvc
          path: target/release/o2cloud-x86_64-pc-windows-msvc.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten artifacts
        run: find artifacts -type f -exec mv {} artifacts/ \; && find artifacts -type d -empty -delete

      - name: Release
        run: gh release create ${{ github.ref_name }} artifacts/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system deps (WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev

      - name: Install Rust
        run: rustup update stable

      - name: Publish to crates.io
        run: cargo publish --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
